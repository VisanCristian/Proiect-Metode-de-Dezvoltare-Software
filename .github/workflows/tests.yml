name: Tests

on:
  push:
    branches: [ main, tests ]
  pull_request:
    branches: [ main, tests ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django ruff pytest-mock pdfplumber reportlab
    - name: Lint with ruff
      run: ruff check backend/
    - name: Run backend tests
      run: |
        cd backend
        pytest
      env:
        DJANGO_SETTINGS_MODULE: StudyAPP.settings
    - name: Check for missing migrations
      run: |
        cd backend
        python manage.py makemigrations --check

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      run: |
        cd frontend
        npm install
    - name: Lint with ESLint
      run: |
        cd frontend
        npm run lint
    - name: Run frontend tests
      run: |
        cd frontend
        npm test
